<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural Network Intelligence Demo</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        .ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }
        .status-text {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: #fff;
            font-size: 14px;
            opacity: 0.8;
            font-weight: 300;
        }
        .intelligence-indicator {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #fbbf24;
            font-size: 12px;
            opacity: 0.9;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div class="ui-overlay">
        <div class="intelligence-indicator" id="intelligenceIndicator">Intelligence Level: 0%</div>
        <div class="status-text" id="statusText">Initializing neural pathways...</div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const intelligenceIndicator = document.getElementById('intelligenceIndicator');
        const statusText = document.getElementById('statusText');

        // Set canvas size
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Neural Network Node Class
        class Node {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 2;
                this.vy = (Math.random() - 0.5) * 2;
                this.radius = Math.random() * 3 + 2;
                this.connections = [];
                this.pulse = 0;
                this.intelligence = 0;
                this.targetIntelligence = Math.random();
            }

            update() {
                // Update position with gentle movement
                this.x += this.vx * 0.1;
                this.y += this.vy * 0.1;

                // Bounce off edges
                if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
                if (this.y < 0 || this.y > canvas.height) this.vy *= -1;

                // Pulse animation
                this.pulse += 0.1;
                
                // Gradually increase intelligence
                this.intelligence += (this.targetIntelligence - this.intelligence) * 0.01;
            }

            draw() {
                const pulseSize = Math.sin(this.pulse) * 0.3 + 1;
                const alpha = 0.3 + this.intelligence * 0.7;
                
                // Draw node glow
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius * pulseSize * 2, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(251, 191, 36, ${alpha * 0.3})`;
                ctx.fill();

                // Draw node core
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius * pulseSize, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(251, 191, 36, ${alpha})`;
                ctx.fill();
            }
        }

        // Connection Class
        class Connection {
            constructor(nodeA, nodeB) {
                this.nodeA = nodeA;
                this.nodeB = nodeB;
                this.strength = Math.random();
                this.dataFlow = 0;
                this.active = false;
            }

            update() {
                const dx = this.nodeB.x - this.nodeA.x;
                const dy = this.nodeB.y - this.nodeA.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                
                // Activate connection if nodes are close enough
                if (distance < 150) {
                    this.active = true;
                    this.dataFlow += 0.02;
                } else {
                    this.active = false;
                    this.dataFlow *= 0.95;
                }
            }

            draw() {
                if (!this.active) return;

                const dx = this.nodeB.x - this.nodeA.x;
                const dy = this.nodeB.y - this.nodeA.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                
                if (distance > 150) return;

                const alpha = this.dataFlow * 0.8;
                
                // Draw connection line
                ctx.beginPath();
                ctx.moveTo(this.nodeA.x, this.nodeA.y);
                ctx.lineTo(this.nodeB.x, this.nodeB.y);
                ctx.strokeStyle = `rgba(251, 191, 36, ${alpha * 0.3})`;
                ctx.lineWidth = 1;
                ctx.stroke();

                // Draw data flow particles
                if (this.dataFlow > 0.1) {
                    const flowPos = (this.dataFlow * 10) % 1;
                    const flowX = this.nodeA.x + dx * flowPos;
                    const flowY = this.nodeA.y + dy * flowPos;
                    
                    ctx.beginPath();
                    ctx.arc(flowX, flowY, 2, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                    ctx.fill();
                }
            }
        }

        // Big Bang Effect Class
        class BigBang {
            constructor() {
                this.particles = [];
                this.centerX = canvas.width / 2;
                this.centerY = canvas.height / 2;
                this.explosionTime = 0;
                this.active = false;
            }

            trigger() {
                this.active = true;
                this.explosionTime = 0;
                this.particles = [];
                
                // Create explosion particles
                for (let i = 0; i < 50; i++) {
                    const angle = (Math.PI * 2 * i) / 50;
                    const speed = Math.random() * 5 + 2;
                    this.particles.push({
                        x: this.centerX,
                        y: this.centerY,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        life: 1,
                        decay: Math.random() * 0.02 + 0.01
                    });
                }
            }

            update() {
                if (!this.active) return;

                this.explosionTime += 0.016;

                // Update particles
                for (let i = this.particles.length - 1; i >= 0; i--) {
                    const particle = this.particles[i];
                    particle.x += particle.vx;
                    particle.y += particle.vy;
                    particle.life -= particle.decay;

                    if (particle.life <= 0) {
                        this.particles.splice(i, 1);
                    }
                }

                if (this.particles.length === 0) {
                    this.active = false;
                }
            }

            draw() {
                if (!this.active) return;

                // Draw explosion particles
                this.particles.forEach(particle => {
                    ctx.beginPath();
                    ctx.arc(particle.x, particle.y, 3 * particle.life, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(251, 191, 36, ${particle.life})`;
                    ctx.fill();
                });

                // Draw shockwave
                const shockwaveRadius = this.explosionTime * 100;
                ctx.beginPath();
                ctx.arc(this.centerX, this.centerY, shockwaveRadius, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(251, 191, 36, ${Math.max(0, 1 - this.explosionTime * 2)})`;
                ctx.lineWidth = 2;
                ctx.stroke();
            }
        }

        // Main animation variables
        const nodes = [];
        const connections = [];
        const bigBang = new BigBang();
        let time = 0;
        let phase = 0; // 0: initialization, 1: network formation, 2: intelligence emergence, 3: big bang

        // Initialize nodes
        for (let i = 0; i < 30; i++) {
            nodes.push(new Node(
                Math.random() * canvas.width,
                Math.random() * canvas.height
            ));
        }

        // Create connections
        for (let i = 0; i < nodes.length; i++) {
            for (let j = i + 1; j < nodes.length; j++) {
                connections.push(new Connection(nodes[i], nodes[j]));
            }
        }

        // Animation loop
        function animate() {
            time += 0.016;

            // Clear canvas with fade effect
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Phase transitions
            if (time < 2) {
                phase = 0;
                statusText.textContent = "Initializing neural pathways...";
            } else if (time < 6) {
                phase = 1;
                statusText.textContent = "Forming neural connections...";
            } else if (time < 10) {
                phase = 2;
                statusText.textContent = "Intelligence emerging...";
            } else if (time < 12) {
                phase = 3;
                statusText.textContent = "Cosmic expansion initiated...";
                if (!bigBang.active) {
                    bigBang.trigger();
                }
            } else {
                statusText.textContent = "Intelligence network active";
            }

            // Update and draw nodes
            nodes.forEach(node => {
                node.update();
                node.draw();
            });

            // Update and draw connections
            connections.forEach(connection => {
                connection.update();
                connection.draw();
            });

            // Update and draw big bang
            bigBang.update();
            bigBang.draw();

            // Calculate overall intelligence level
            const avgIntelligence = nodes.reduce((sum, node) => sum + node.intelligence, 0) / nodes.length;
            const intelligencePercent = Math.round(avgIntelligence * 100);
            intelligenceIndicator.textContent = `Intelligence Level: ${intelligencePercent}%`;

            // Add cosmic background effects
            if (time > 8) {
                // Draw cosmic web effect
                ctx.strokeStyle = 'rgba(251, 191, 36, 0.1)';
                ctx.lineWidth = 0.5;
                for (let i = 0; i < 5; i++) {
                    const x1 = Math.random() * canvas.width;
                    const y1 = Math.random() * canvas.height;
                    const x2 = Math.random() * canvas.width;
                    const y2 = Math.random() * canvas.height;
                    ctx.beginPath();
                    ctx.moveTo(x1, y1);
                    ctx.lineTo(x2, y2);
                    ctx.stroke();
                }
            }

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
